name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "Ketamine/**"
      - "project.yml"
      - ".github/workflows/build-unsigned-ipa.yml"
      - "scripts/build-unsigned-ipa.sh"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build/DerivedData
          xcodebuild \
            -project Ketamine.xcodeproj \
            -scheme Ketamine \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/DerivedData/Build/Products -name 'Ketamine.app' -type d | head -1)"
          test -n "$APP"
          echo "Using app: $APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -a "$APP" build/Payload/
          (
            cd build
            zip -qr Ketamine-unsigned.ipa Payload
          )
          ls -lh build/Ketamine-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ketamine-unsigned-ipa
          path: build/Ketamine-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
